<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Stran ne obstaja — Energetika Vodovod</title>
<style>
  :root { --ink:#12161a; --muted:#5d6670; --red:#c90d0c; --paper:#f7f5f2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:grid; place-items:center; padding:32px; background:var(--paper); color:var(--ink); font-family:Inter,system-ui,sans-serif; }
  main { width:min(620px,100%); }
  .brand { display:inline-flex; align-items:baseline; gap:6px; margin-bottom:56px; text-decoration:none; color:var(--ink); }
  .brand strong { font-family:Poppins,system-ui,sans-serif; font-size:1.4rem; letter-spacing:-.04em; }
  .brand span { color:var(--muted); font-size:1rem; }
  .code { color:var(--red); font-family:Poppins,system-ui,sans-serif; font-size:.8rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; }
  h1 { margin-top:12px; font-family:Poppins,system-ui,sans-serif; font-size:clamp(2.4rem,7vw,4rem); line-height:1.02; letter-spacing:-.05em; }
  p { margin-top:18px; max-width:46ch; font-size:1.05rem; line-height:1.65; color:var(--muted); }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:30px; }
  a.button { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 18px; border-radius:8px; background:var(--ink); color:#fff; font-size:.875rem; font-weight:600; text-decoration:none; }
  a.button.secondary { background:transparent; color:var(--ink); border:1px solid #d8d2ca; }
  a.button:hover { background:var(--red); }
  a.button.secondary:hover { background:#fff; color:var(--ink); }
</style>
</head>
<body>
<main>
  <a class="brand" href="/" aria-label="Energetika Vodovod — domov"><strong>energetika</strong><span>vodovod</span></a>
  <p class="code">Napaka 404</p>
  <h1>Te strani ne najdemo.</h1>
  <p>Morda je bila povezava spremenjena ali stran ne obstaja več. Vrnite se na domačo stran ali si oglejte naše storitve.</p>
  <div class="actions">
    <a class="button" href="/">Na domačo stran</a>
    <a class="button secondary" href="/storitve/">Vse storitve</a>
    <a class="button secondary" href="/kontakt.html">Kontakt</a>
  </div>
</main>
</body>
</html>
